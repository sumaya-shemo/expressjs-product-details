
name: Express Product Details CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Run ESLint
      - name: Run Lint
        run: npm run lint

      # 5. Run automated tests
      - name: Run Tests
        run: npm test

      # 6. Configure SSH
      - name: Configure SSH
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -e

          mkdir -p ~/.ssh

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY is missing"
            exit 1
          fi

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST is missing"
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SERVER_PORT" \
            -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # 7. Validate server configuration
      - name: Validate Server Configuration
        if: github.event_name == 'push'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST is missing"
            exit 1
          fi

          if [ -z "$SERVER_USER" ]; then
            echo "ERROR: SERVER_USER is missing"
            exit 1
          fi

          echo "Server configuration validated"

      # 8. Test SSH connection
      - name: Test SSH Connection
        if: github.event_name == 'push'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH connection successful'"

      # 9. Deploy application files
      - name: Deploy Application Files
        if: github.event_name == 'push'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          DEPLOY_PATH: /var/www/expressjs-product-details
        run: |
          set -e

          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test' \
            -e "ssh -p $SERVER_PORT" \
            ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      # 10. Install production dependencies
      - name: Install Production Dependencies
        if: github.event_name == 'push'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'
              set -e
              cd /var/www/expressjs-product-details
              npm install --omit=dev
          EOF

      # 11. Restart application
      - name: Restart Express Application
        if: github.event_name == 'push'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'
              set -e

              sudo systemctl restart express-product

              sudo systemctl is-active --quiet express-product

              echo "Deployment successful!"
          EOF
